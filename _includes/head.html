<header
  class="welcome-hero"
  {% if page.cover_image %}
  style="--hero-image: url('{{ page.cover_image.image }}');"
  {% endif %}
>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-11 col-xl-10 text-center">
        <div class="header-text">
          <h2>
            EMNLP {{ page.year }} Workshop on<br />
            Multimodal Interaction in Face-to-Face Dialogue (MINT)
          </h2>

          {% if page.subtitle %}
          <p class="subtitle">{{ page.subtitle }}</p>
          {% endif %}

          <div class="info-wrapper">
            <p><i class="fas fa-calendar-alt"></i> {{ page.date }}</p>
            <p><i class="fas fa-map-marker-alt"></i> {{ page.location }}</p>
          </div>

          {% if page.buttons %}
          <div class="btn-wrapper d-flex justify-content-center">
            {% for button in page.buttons %}
            <a
              href="{{ button.url }}"
              class="btn btn-custom"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{ button.text }}
            </a>
            {% endfor %}
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</header>
